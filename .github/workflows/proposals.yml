name: Proposals
# Counts maintainers' votes on the changes suggested on Suggest Edits, and publishes each approved change
# as a new version. The robot is scripts/proposals.py; the rules are in GOVERNANCE.md.

on:
  # Supabase starts the robot every ten minutes and right after each vote, through workflow_dispatch (supabase/robot.sql).
  # GitHub's own schedule is a backup: GitHub runs it late, or skips it, when it's busy.
  schedule:
    - cron: "7-59/15 * * * *"
  issue_comment:  # a maintainer voted on a proposal's issue
    types: [created, edited]
  push:  # a maintainer changed the text or the list of maintainers
    branches: [main]
    paths: ["draft/AGENTS.md", "governance/maintainers.json"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would happen; change nothing"
        type: boolean
        default: false

permissions:
  contents: write  # commit and tag new versions
  issues: write  # open and close an issue for each proposal
  actions: write  # keep this schedule switched on (see the last step)
  pages: write  # rebuild the site after publishing

concurrency:
  group: proposals
  cancel-in-progress: false

jobs:
  proposals:
    if: >-
      github.event_name != 'issue_comment' ||
      (contains(github.event.issue.body, '<!-- proposal:') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every version's tag, for the change log

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Argon2 (fingerprints are Argon2id hashes)
        run: python3 -m pip install --quiet argon2-cffi==25.1.0

      - name: Test the robot
        run: python3 -m unittest discover -s scripts/tests -t scripts/tests

      - name: Count votes and publish approved changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          before=$(git rev-parse HEAD)
          if [ "$DRY_RUN" = "true" ]; then
            python3 scripts/proposals.py --dry-run
          else
            python3 scripts/proposals.py --push
          fi
          # GitHub doesn't always rebuild the site after a push made from here, so ask it to.
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            gh api -X POST "repos/$REPO/pages/builds" --silent || echo "Couldn't ask GitHub to rebuild the site."
          fi

      # GitHub switches off scheduled workflows in a repository with no activity for 60 days. Re-enabling this
      # one once a day resets that clock, and the robot also makes an empty commit after a month with no others.
      # (Reading the Suggest Edits database every run keeps Supabase from pausing the free project, too.)
      - name: Keep the schedule switched on
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%H)" = "00" ] && [ "$(date -u +%M)" -lt 30 ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/proposals.yml/enable"
          fi
